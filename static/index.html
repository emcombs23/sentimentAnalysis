<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Sentiment Classifier</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<main class="container">
		<h1>Sentiment Classifier</h1>
		<label for="text-input" class="sr-only">Enter sentence</label>
		<textarea id="text-input" placeholder="Type a sentence..." rows="4"></textarea>
		<div class="actions">
			<button id="classify-btn">Classify</button>
		</div>
		<div id="result" aria-live="polite"></div>
	</main>
	<script src="/script.js"></script>
</body>
</html>
